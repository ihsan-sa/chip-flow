# faults manifest (docs/design.md section 3): the analog-tile rung. vout
# leaves the chip on ua[0] (interface.yaml's ua_pins), so the untouched top
# must harden on the analog pin template, match in top_lvs and pass
# precheck; each plant hardens the untouched top first (see its docstring).
version: 1
faults:
  - name: top_lvs_macro_pin_unconnected
    gate: top_lvs
    plant: plant_top_lvs.py
    expect: {status: fail, kind: netlist_mismatch}
  - name: precheck_ua_pad_unwired
    gate: precheck
    plant: plant_precheck.py
    expect: {status: fail, kind: precheck_failed}
